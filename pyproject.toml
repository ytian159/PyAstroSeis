[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyastroseis"
version = "0.2.0"
description = "Boundary-element seismic wavefield solver for small planetary bodies (Python port of AstroSeis)"
readme = "pyastroseis/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Yuan Tian", email = "ytian159@gmail.com" }]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
plot = ["matplotlib"]
yaml = ["pyyaml"]

[tool.setuptools]
packages = ["pyastroseis"]

[tool.setuptools.package-data]
pyastroseis = ["data/*"]
